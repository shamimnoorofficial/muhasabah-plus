(function(){
  var root=document.documentElement, pending=null, focusEl=null;
  function kbHeight(){
    var vv=window.visualViewport; if(!vv) return 0;
    var h=window.innerHeight-vv.height-vv.offsetTop; return h<40?0:Math.round(h);
  }
  function keepVisible(el){
    if(!el||!el.getBoundingClientRect) return;
    try{
      var vv=window.visualViewport;
      var top=vv?vv.offsetTop:0, bottom=vv?vv.offsetTop+vv.height:window.innerHeight;
      var r=el.getBoundingClientRect();
      if(r.bottom>bottom-24||r.top<top+8) el.scrollIntoView({block:"center",behavior:"smooth"});
      var panel=el.closest&&el.closest(".kb-modal-panel");
      if(panel){
        var pr=panel.getBoundingClientRect(), er=el.getBoundingClientRect();
        if(er.bottom>pr.bottom-16) panel.scrollTop+=(er.bottom-pr.bottom+56);
      }
    }catch(e){}
  }
  function apply(){
    var h=kbHeight();
    root.style.setProperty("--kb-offset", h+"px");
    root.classList.toggle("kb-open", h>0);
    if(focusEl) keepVisible(focusEl);
  }
  function schedule(){ if(pending) cancelAnimationFrame(pending); pending=requestAnimationFrame(function(){pending=null;apply();}); }
  if(window.visualViewport){ window.visualViewport.addEventListener("resize",schedule); window.visualViewport.addEventListener("scroll",schedule); }
  window.addEventListener("resize",schedule);
  window.addEventListener("focusin",function(e){
    var t=e.target; if(!t) return;
    if(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"){
      focusEl=t; schedule();
      [50,150,350,500].forEach(function(ms){ setTimeout(schedule,ms); });
    }
  });
  window.addEventListener("focusout",function(){ focusEl=null; setTimeout(schedule,120); setTimeout(schedule,300); });
  window.addEventListener("input",function(e){
    var t=e.target; if(!t) return;
    if(t.tagName!=="TEXTAREA"&&t.tagName!=="INPUT") return;
    focusEl=t;
    if(t.tagName==="TEXTAREA"){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,160)+"px"; }
    schedule(); setTimeout(function(){ keepVisible(t); },40);
  },true);
  schedule();
})();
